services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    profiles: ["prod"]

  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - .:/app # Bind entire project for live source sync
      - /app/node_modules # Prevent host/container module conflicts
    stdin_open: true # Keep container running for dev
    tty: true
    profiles: ["dev"]

volumes:
  mongo-data:
    name: love-grid-mongo-data

networks:
  default:
    driver: bridge
    name: love-grid-network
